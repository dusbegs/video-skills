<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSAP Hello — video-skills</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0a0f14; color: #f5f5f5; font-family: system-ui, sans-serif; }
  .card { text-align: center; padding: 2rem; }
  .judul { font-size: 3rem; margin: 0; color: #f5c518; }
  .subjudul { font-size: 1.2rem; opacity: .8; }
  .tombol { margin-top: 1.5rem; padding: .8rem 1.6rem; font-size: 1rem;
            background: #f5c518; border: 0; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="judul">TENGAH MALAM INDO</h1>
    <p class="subjudul">Horor &amp; true crime Indonesia — 60 detik.</p>
    <button class="tombol" onclick="putar()">▶ Putar lagi</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    function putar() {
      const tl = gsap.timeline();
      tl.from(".judul", { y: 50, opacity: 0, duration: 0.8, ease: "power3.out" })
        .from(".subjudul", { y: 30, opacity: 0, duration: 0.6 }, "-=0.3")
        .from(".tombol", { scale: 0.9, opacity: 0, duration: 0.4 }, "-=0.2");
    }
    putar();
  </script>
</body>
</html>
